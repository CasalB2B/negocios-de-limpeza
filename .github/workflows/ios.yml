# Builds the iPhone app on a Mac in the cloud and sends it to TestFlight (App Store Connect).
# Start it by hand: GitHub → Actions → iOS → Run workflow.
# Needs the secrets APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and APPLE_TEAM_ID
# (App Store Connect API key with Admin access, so Xcode can create the signing certificate itself).
name: iOS

on:
  workflow_dispatch:
  # Also on its own when the native iPhone part changes (website changes reach the app without a new build).
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Xcode mais novo
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync ios
      - name: Chave da App Store Connect
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$P8" ] || [ -z "$KEY_ID" ]; then echo "Faltam os segredos APPLE_API_KEY_P8 / APPLE_API_KEY_ID no GitHub."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          K="$RUNNER_TEMP/keys/AuthKey.p8"
          # Rebuild a clean PEM whatever way it was pasted (Windows line breaks, spaces, one long line, "\n" typed).
          CORPO=$(printf '%s' "$P8" | sed 's/\\n/\n/g' | tr -d '\r' \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \t\n')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$CORPO" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$K"
          if ! openssl pkey -in "$K" -noout 2>/dev/null; then
            echo "A chave em APPLE_API_KEY_P8 não é válida (tamanho do conteúdo: ${#CORPO} caracteres; uma chave da Apple tem cerca de 200)."
            echo "Abra o arquivo AuthKey_NT2NK6LRLQ.p8 no Bloco de Notas, copie TUDO (Ctrl+A, Ctrl+C) e cole de novo no segredo."
            exit 1
          fi
          echo "Chave OK."
      # Archive without signing (a development profile would need a registered iPhone); the export step
      # signs it for the App Store with a distribution certificate Xcode creates through the API key.
      - name: Montar o app (archive)
        working-directory: ios/App
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -80
          test -d "$RUNNER_TEMP/App.xcarchive"
          # An unsigned archive carries no entitlements, and the export re-signs with the ones it finds.
          # A local (ad-hoc) signature keeps the push permission (aps-environment) in the app.
          codesign --force --sign - --entitlements App/App.entitlements "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign -d --entitlements - "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" | grep -q aps-environment && echo "Permissão de notificações incluída."
      - name: Enviar para o TestFlight
        working-directory: ios/App
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
      - name: Apagar a chave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
